name: CineRadar source monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

concurrency:
  group: cineradar-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Monitor known sources
        run: node scripts/cineradar/monitor.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_LLM_CALLS_PER_RUN: "80"
          HTTP_TIMEOUT_MS: "12000"
          LLM_TIMEOUT_MS: "45000"
          MONITOR_LINK_LIMIT: "2"
          LLM_CONCURRENCY: "2"
          URL_VALIDATION_CONCURRENCY: "4"
