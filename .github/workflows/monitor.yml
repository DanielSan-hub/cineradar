name: CineRadar source monitor

on:
  workflow_dispatch:
  schedule:
    # Two runs of 1,000 sources a day cover the registry's adaptive schedules.
    - cron: "43 4,16 * * *"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh known sources with HTTP and hashes only
        run: node scripts/cineradar/monitor.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "12000"
          MONITOR_LINK_LIMIT: "6"
          SOURCE_REFRESH_LIMIT: "1000"
          MONITOR_CONCURRENCY: "12"
          MONITOR_TIME_BUDGET_SECONDS: "540"
