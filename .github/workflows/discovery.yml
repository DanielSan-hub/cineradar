name: CineRadar discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover and ingest opportunities
        run: node scripts/cineradar/discover.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
          GROQ_FALLBACK_ENABLED: "false"
          DISCOVERY_QUERY_LIMIT: "4"
          DISCOVERY_RESULT_LIMIT: "5"
          MAX_LLM_CALLS_PER_RUN: "60"
          FREE_PROCESSING_LIMIT: "300"
          HTTP_TIMEOUT_MS: "12000"
          LLM_TIMEOUT_MS: "45000"
          LLM_CONCURRENCY: "2"
          URL_VALIDATION_CONCURRENCY: "4"
          MONTHLY_TARGET_EUR: "3"
          OPTIONAL_STOP_EUR: "4"
          MONTHLY_BUDGET_EUR: "5"
          USD_TO_EUR_RATE: "1"
          CLOUDFLARE_DAILY_NEURON_LIMIT: "9000"
