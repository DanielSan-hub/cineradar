name: CineRadar discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

concurrency:
  group: cineradar-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover and ingest opportunities
        run: node scripts/cineradar/discover.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCOVERY_QUERY_LIMIT: "24"
          DISCOVERY_RESULT_LIMIT: "8"
          MAX_LLM_CALLS_PER_RUN: "80"
          HTTP_TIMEOUT_MS: "12000"
          LLM_TIMEOUT_MS: "45000"
          LLM_CONCURRENCY: "2"
          URL_VALIDATION_CONCURRENCY: "4"
