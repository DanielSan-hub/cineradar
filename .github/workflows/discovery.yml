name: CineRadar discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      # GitHub starts scheduled runs hours late. The Supabase dispatcher
      # (pg_cron -> workflow_dispatch) is the on-time trigger; this schedule
      # is only a fallback and stops at once when a dispatched run covered
      # the slot.
      - name: Skip when the external scheduler already ran this slot
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '10 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          covered=$(gh api "repos/${{ github.repository }}/actions/workflows/discovery.yml/runs?event=workflow_dispatch&created=>=$since&per_page=5" --jq '[.workflow_runs[] | select(.conclusion != "failure" and .conclusion != "cancelled")] | length')
          if [ "$covered" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "A dispatched run already covered this slot."; fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Discover and ingest opportunities
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/cineradar/discover.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
          # Groq's free tier takes over only when Cloudflare refused before any
          # inference (daily allowance used); inactive without GROQ_API_KEY.
          # Calls rotate across the account's free models (each has its own
          # quota), starting from GROQ_MODEL; free-tier usage is booked at 0.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FALLBACK_ENABLED: "true"
          GROQ_FREE_TIER: "true"
          GROQ_MODEL: "openai/gpt-oss-20b"
          BROWSER_RENDER_ENABLED: "true"
          # Zero spend (owner, 2026-10-03): Exa only inside its free USD 10 a
          # month (ledger pool 9, optional work stops at 8.1). A few gap
          # searches a run; most Exa credit goes to site resolution below.
          DISCOVERY_QUERY_LIMIT: "3"
          DISCOVERY_RESULT_LIMIT: "10"
          EXA_MONTHLY_BUDGET_EUR: "9"
          EXA_MONTHLY_TARGET_EUR: "7"
          MAX_LLM_CALLS_PER_RUN: "130"
          DISCOVERY_LLM_TIME_BUDGET_SECONDS: "720"
          FREE_PROCESSING_LIMIT: "1500"
          PAGE_FETCH_CONCURRENCY: "12"
          SERIES_CONCURRENCY: "10"
          SERIES_TIME_BUDGET_SECONDS: "900"
          HTTP_TIMEOUT_MS: "12000"
          LLM_TIMEOUT_MS: "45000"
          LLM_CONCURRENCY: "3"
          URL_VALIDATION_CONCURRENCY: "4"
          MONTHLY_TARGET_EUR: "3"
          OPTIONAL_STOP_EUR: "4"
          MONTHLY_BUDGET_EUR: "5"
          USD_TO_EUR_RATE: "1"
          CLOUDFLARE_DAILY_NEURON_LIMIT: "9000"
      # FestAgent lists open festivals with their deadline calendars and own
      # websites; its terms allow use with a link to the source, which every
      # FestAgent fact keeps. Only new or changed cards are opened, one
      # request every 1.5 s; no LLM, no paid service. Festhome is never read:
      # its terms forbid automated collection without written consent.
      - name: Read the FestAgent calendar (no LLM)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/cineradar/harvest-platforms.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "12000"
          URL_VALIDATION_CONCURRENCY: "4"
          FESTAGENT_LISTING_PAGES: "60"
          FESTAGENT_DETAIL_LIMIT: "150"
          PLATFORMS: "festagent"
          PLATFORM_TIME_BUDGET_SECONDS: "840"
      # Creative Europe MEDIA calls from the EU Funding & Tenders Portal's
      # public search API (free, robots.txt allows it; reuse under CC BY 4.0).
      - name: Read Creative Europe MEDIA calls (EU portal API, no LLM)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/cineradar/harvest-eu-funding.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "15000"
          EU_FT_TOPIC_LIMIT: "30"
      # Italy for Movies (Cinecittà / Ministry of Culture): Italian film funds;
      # the funder's own page is the official page. Free, no LLM.
      - name: Read Italian film funds (Italy for Movies, no LLM)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/cineradar/harvest-italy-for-movies.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "15000"
          IFM_PAGE_LIMIT: "60"
          IFM_RECHECK_DAYS: "3"
      - name: Hunt deadlines on the calls' own Submit/Rules pages (no LLM)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/cineradar/hunt-deadlines.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BROWSER_RENDER_ENABLED: "true"
          HTTP_TIMEOUT_MS: "12000"
          HUNT_LIMIT: "150"
          HUNT_TIME_BUDGET_SECONDS: "360"
      - name: Triage the review queue (archive expired, score readiness)
        if: always() && steps.guard.outputs.skip != 'true'
        run: node scripts/cineradar/triage.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Automatic review (approve proven calls, reject non-calls, escalate the rest)
        if: always() && steps.guard.outputs.skip != 'true'
        run: node scripts/cineradar/auto-review.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BROWSER_RENDER_ENABLED: "true"
          AUTO_APPROVE_LIMIT: "50"
      - name: Harvest directories for new official sources (no facts copied)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/cineradar/harvest-directories.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "12000"
          HARVEST_DIRECTORY_LIMIT: "25"
          HARVEST_PAGES_PER_DIRECTORY: "40"
          HARVEST_TIME_BUDGET_SECONDS: "300"
      # Own websites for calls known only by name (pending records on
      # someone else's page, lapsed Wikidata domains): Tavily's free plan first (capped at
      # 900 of its 1,000 monthly credits), Exa "instant" inside its free
      # credits as fallback. Only sources are registered; no fact is copied.
      - name: Resolve own websites for names (free search tiers)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/cineradar/resolve-names.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY }}
          TAVILY_MONTHLY_CREDIT_CAP: "900"
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_MONTHLY_BUDGET_EUR: "9"
          EXA_MONTHLY_TARGET_EUR: "7"
          USD_TO_EUR_RATE: "1"
          HTTP_TIMEOUT_MS: "12000"
          RESOLVE_SEARCH_LIMIT: "15"
          RESOLVE_EXA_LIMIT: "15"
          RESOLVE_TIME_BUDGET_SECONDS: "420"
