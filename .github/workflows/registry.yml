name: CineRadar registry refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "11 5 3 * *"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Add new film festivals from Wikidata (free, sources only)
        run: node scripts/cineradar/import-registry.mjs --only-wikidata --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
