name: CineRadar historical backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "53 5 2 * *"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Backfill evidence from 2023 with bounded direct HTTP
        run: node scripts/cineradar/history-backfill.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "12000"
          HISTORICAL_PAGE_LIMIT: "10"
