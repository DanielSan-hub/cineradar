name: CineRadar weekly revalidation and brief

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * 0"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Revalidate stored URLs without LLM
        run: node scripts/cineradar/revalidate-urls.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "12000"
          URL_VALIDATION_CONCURRENCY: "4"
          REVALIDATION_LIMIT: "200"
      - name: Build the weekly team brief (stored records only, no LLM)
        if: always()
        run: node scripts/cineradar/weekly-brief.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Weekly coverage against the owner's reference datasets, read from the
      # private Supabase bucket (never from the repo or the owner's PC).
      # Prints aggregates only; the report is stored privately for /team/brief.
      - name: Measure coverage of the reference datasets (private, aggregates only)
        if: always()
        continue-on-error: true
        run: node scripts/cineradar/coverage.mjs --store
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
