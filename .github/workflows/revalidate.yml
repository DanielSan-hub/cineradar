name: CineRadar URL revalidation

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * 0"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Revalidate stored URLs without LLM
        run: node scripts/cineradar/revalidate-urls.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HTTP_TIMEOUT_MS: "12000"
          URL_VALIDATION_CONCURRENCY: "4"
          REVALIDATION_LIMIT: "200"
