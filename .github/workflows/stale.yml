name: CineRadar stale review

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 1 * *"

concurrency:
  group: cineradar-pipeline
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report stale records without LLM or auto-closing
        run: node scripts/cineradar/stale-check.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STALE_CHECK_LIMIT: "1000"
